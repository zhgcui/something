          "text": "ERP厂商作为AI中间层，客户付费 = 大模型API调用费(Token) + 平台运维 + 实施交付 + 销售人力 + 厂商利润。如果客户有技术能力，直接调DeepSeek/通义千问API的成本远低于通过ERP使用AI——同样的模型、同样的Token，中间层每一环都在加价。这个溢价必须来自独有价值，但困境一已经证明AI产出仍需人工判断，那溢价就失去了支撑。海外定价现实同样验证了溢价的脆弱性：SAP的AI Unit按100个起购、列表价约€700（约€7/个）单独计费，Joule基础功能虽含于RISE许可，深度用例仍需额外购买；Salesforce Agentforce按对话计费（$2/对话起）或按Flex Credits计量（标准动作约$0.10），按量计费使得企业难以事前预测AI总投入。国内厂商的AI合同规模也显示市场仍在早期：金蝶2025年AI签约3.56亿元（约占总收入70.06亿元的5%），用友AI相关合同签约16.7亿元（含AI模块的合同签约口径，同期净亏损13.89亿元、同比减亏6.72亿元）——AI尚未成为独立盈利的业务支柱。更不利的是，ERP AI的交付成本结构远高于标准化产品：AI功能需要场景配置、Prompt调优、数据准备、效果验证，每单都需要实施人员介入。成本不降反升的另一面是客户感知：企业发现上了AI之后IT支出多了一块Token消耗费，却看不到对应的人头减少或效率提升——这笔账算不平，续费就无从谈起。"

      return '<tr'+rowAttrs+'>'+html+'</tr>';
    }).join('');
  }
  function renderBlocks(blocks){
    var html = '';
    (blocks || []).forEach(function(block){ html += renderBlock(block); });
    if(!hasText(html)) return '';
    return blocksNeedGrid(blocks) ? '<div class="chart-grid">'+html+'</div>' : html;
  }
  function renderChartsInBlocks(blocks){
    (blocks || []).forEach(function(block){
      if(block.type === 'chart') renderChart(block);
      if(block.type === 'subsection') renderChartsInBlocks(block.blocks || []);
    });
  }
  function tocFromBlocks(blocks){
    var html = '';
    (blocks || []).forEach(function(block){
      if(block.type === 'chart' && hasText(block.title)) html += '<a href="#'+safeId(block.id)+'" class="sub">'+escapeHTML(block.title || '')+'</a>';
      if(block.type === 'subsection'){
        if(hasText(block.title)) html += '<a href="#'+safeId(block.id)+'" class="sub">'+escapeHTML(block.title || '')+'</a>';
        html += tocFromBlocks(block.blocks || []);
      }
    });
    return html;
  }
  function renderBlock(block){
    var id = safeId(block.id);
    if(block.type === 'chart'){
      var span = spanClass(block.span, 12);
      var tall = block.tall ? ' tall' : '';
      var chartStyle = '';
      var chartHasSource = Object.keys(getLineage(id)).length > 0;
      var autoHeight = chartHeight(block);
      if(autoHeight) chartStyle = ' style="height:'+autoHeight+'px"';
      return '<div class="chart-card '+span+(chartHasSource ? ' source-enabled' : '')+extraClass(block)+'" id="'+id+'"'+(chartHasSource ? sourceAttrs(id) : '')+'>'+(chartHasSource ? '<button class="source-btn" type="button" aria-label="'+escapeHTML(t('viewSource'))+'" title="'+escapeHTML(t('viewSource'))+'">'+sourceIcon()+'</button>' : '')+(hasText(block.title) ? '<h3'+rawDataAttr(block.title)+'>'+escapeHTML(block.title)+'</h3>' : '')+'<div id="'+id+'-chart" class="chart'+tall+'"'+chartStyle+'></div>'+(hasText(block.note) ? '<div class="chart-note"'+rawDataAttr(block.note)+'>'+escapeHTML(block.note)+'</div>' : '')+'</div>';
    }
    if(block.type === 'table'){
      var lineage = getLineage(id);
      var hasSource = lineage && Object.keys(lineage).length > 0;
      var tableSpan = spanClass(block.span, 12);
      var head = renderTableHead(block.columns || [], id);
      var rows = renderTableBody(block, id);
      return '<div class="table-card '+tableSpan+(hasSource ? ' source-enabled source-card' : '')+extraClass(block)+'" id="'+id+'"'+(hasSource ? cardSourceAttrs(id) : '')+'>'+(hasText(block.title) ? '<h3'+rawDataAttr(block.title)+'>'+escapeHTML(block.title)+'</h3>' : '')+'<div class="table-wrap"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+(hasText(block.note) ? '<div class="chart-note"'+rawDataAttr(block.note)+'>'+escapeHTML(block.note)+'</div>' : '')+'</div>';
    }
    if(block.type === 'subsection'){
      var subSpan = spanClass(block.span, 12);
      var subBody = renderBlocks(block.blocks || []);
      if(!hasText(block.title) && !hasText(block.lead) && !hasText(subBody)) return '';
      return '<section class="subsection-card '+subSpan+extraClass(block)+'" id="'+id+'">'+(hasText(block.title) ? '<h3'+rawDataAttr(block.title)+'>'+escapeHTML(block.title)+'</h3>' : '')+(hasText(block.lead) ? '<p class="muted"'+rawDataAttr(block.lead)+'>'+escapeHTML(block.lead)+'</p>' : '')+subBody+'</section>';
    }
    if(block.type === 'html') return String(block.html || '');
    return renderNote(block);
  }
  function placeNavForViewport(){
    var nav = document.getElementById('reportNav');
    var app = document.getElementById('app');
    if(!nav || !app) return;
    var hero = app.querySelector('.hero');
    if(isMobileView() && hero){
      if(nav.parentNode !== app || nav.previousElementSibling !== hero) hero.insertAdjacentElement('afterend',nav);
    }else if(nav.parentNode === app){
      document.body.insertBefore(nav,app);
    }
    updateTocScrollbarHeight();
  }

  function groupFlatBlocks(section){
    var blocks = section && section.blocks;
    if(!Array.isArray(blocks) || !blocks.length) return blocks || [];
    var needsGrouping = blocks.some(function(block){ return block && block.type !== 'subsection' && hasText(block.subsection); });
    if(!needsGrouping) return blocks;
    var meta = {};
    (Array.isArray(section.subsections) ? section.subsections : []).forEach(function(entry){
      if(entry && hasText(entry.title)) meta[entry.title] = entry;
    });
    var out = [], current = null;
    blocks.forEach(function(block){
      if(!block || typeof block !== 'object'){ return; }
      var title = block.type !== 'subsection' && hasText(block.subsection) ? String(block.subsection) : '';
      if(!title){ current = null; out.push(block); return; }
      if(!current || current.title !== title){
        var info = meta[title] || {};
        current = {
          type: 'subsection',
          id: info.id || ('sub-' + safeId(block.id || ('g' + out.length))),
          title: title,
          lead: info.lead,
          span: info.span,
          blocks: []
        };
        out.push(current);
      }

      var copy = {}, key;
      for(key in block){ if(Object.prototype.hasOwnProperty.call(block, key) && key !== 'subsection') copy[key] = block[key]; }
      current.blocks.push(copy);
    });
    return out;
  }
  function normalizeSections(sections){
    if(!Array.isArray(sections)) return [];
    return sections.map(function(section){
      if(!section || typeof section !== 'object') return section;
      var grouped = groupFlatBlocks(section);
      if(grouped === section.blocks) return section;
      var copy = {}, key;
      for(key in section){ if(Object.prototype.hasOwnProperty.call(section, key)) copy[key] = section[key]; }
      copy.blocks = grouped;
      return copy;
    });
  }
  function renderReport(data){
    applyLocale(data);
    data = data || {};
    data.sections = normalizeSections(data.sections);
    document.title = data.title || 'ABI Report';
    var meta = (data.meta || []).filter(function(m){ return hasText(m.label) || hasText(m.value); }).map(function(m){return '<span class="pill">'+(hasText(m.label) ? escapeHTML(m.label)+(hasText(m.value) ? t('metaSeparator') : '') : '')+escapeHTML(m.value || '')+'</span>';}).join('');
    var html = '<section class="hero">'+(hasText(data.title) ? '<h1>'+escapeHTML(data.title)+'</h1>' : '')+(hasText(data.subtitle) ? '<p>'+escapeHTML(data.subtitle)+'</p>' : '')+(meta ? '<div class="meta">'+meta+'</div>' : '')+'</section><section class="grid">';
    var toc = '';
    (data.kpis || []).forEach(function(kpi){
      var id = safeId(kpi.id);
      if(!hasText(kpi.label) && !hasText(kpi.value) && !hasText(kpi.desc)) return;
      var kpiHasSource = Object.keys(getLineage(id)).length > 0;
      html += '<div class="card '+spanClass(kpi.span,3)+' kpi '+escapeHTML(kpiClass(kpi.tone))+(kpiHasSource ? ' source-enabled source-card' : '')+extraClass(kpi)+'" id="'+id+'"'+kpiStyle(kpi.tone)+(kpiHasSource ? cardSourceAttrs(id) : '')+'>'+(hasText(kpi.label) ? '<span class="label"'+rawDataAttr(kpi.label)+'>'+escapeHTML(kpi.label)+'</span>' : '')+(hasText(kpi.value) ? '<span class="value"'+rawDataAttr(kpi.value)+'>'+escapeHTML(kpi.value)+'</span>' : '')+(hasText(kpi.desc) ? '<span class="muted"'+rawDataAttr(kpi.desc)+'>'+escapeHTML(kpi.desc)+'</span>' : '')+'</div>';
    });
    (data.sections || []).forEach(function(section){
      var sid = safeId(section.id);
      var sectionBody = renderBlocks(section.blocks || []);
      if(!hasText(section.title) && !hasText(section.lead) && !hasText(sectionBody)) return;
      if(hasText(section.title)) toc += '<a href="#'+sid+'">'+escapeHTML(section.title)+'</a>';
      toc += tocFromBlocks(section.blocks || []);
      html += '<div class="card '+spanClass(section.span,12)+extraClass(section)+'" id="'+sid+'">';
      if(hasText(section.title)) html += '<h2'+rawDataAttr(section.title)+'>'+escapeHTML(section.title)+'</h2>';
      if(hasText(section.lead)) html += '<p class="muted"'+rawDataAttr(section.lead)+'>'+escapeHTML(section.lead)+'</p>';
      html += sectionBody;
      html += '</div>';
    });
    html += '</section>';
    var app = document.getElementById('app');
    var nav = document.getElementById('reportNav');
    if(nav && nav.parentNode === app) document.body.insertBefore(nav,app);
    charts.forEach(function(item){ if(item && item.chart) item.chart.dispose(); });
    charts = [];
    app.innerHTML = html;
    document.getElementById('toc-links').innerHTML = toc;
    placeNavForViewport();
    (data.sections || []).forEach(function(section){ renderChartsInBlocks(section.blocks || []); });
    bindSourceDrawer();
    bindActiveNav();
  }

  function bindSourceDrawer(){
    var drawer = document.querySelector('.source-drawer');
    var overlay = document.querySelector('.source-overlay');
    if(!drawer || !overlay) return;
    var fields = {
      title: document.getElementById('sourceDrawerTitle'),
      processLabel: document.getElementById('sourceProcessLabel'),
      process: document.getElementById('sourceProcess'),
      processSection: document.getElementById('sourceProcessSection')
    };
    fields.processLabel.textContent = t('process');
    function renderProcessList(title, rows){
      if(!Array.isArray(rows) || !rows.length) return '';
      return '<section class="source-process-group"><h4>'+escapeHTML(title)+'</h4><ul>'+rows.map(function(row){
        if(typeof row === 'string') return '<li>'+escapeHTML(row)+'</li>';
        if(row && typeof row === 'object') return '<li>'+escapeHTML([row.source,row.target,row.value,row.text].filter(Boolean).join(' → '))+'</li>';
        return '';
      }).join('')+'</section>';
    }
    function renderProcess(item){
      var p = item.process || {};
      var html = '';
      html += renderProcessList(t('fieldMapping'), p.fieldMapping);
      html += renderProcessList(t('filters'), p.filters);
      html += renderProcessList(t('aggregations'), p.aggregations);
      html += renderProcessList(t('calculations'), p.calculations);
      if(hasText(p.result)) html += '<section class="source-process-group"><h4>'+escapeHTML(t('derivation'))+'</h4><p>'+escapeHTML(p.result)+'</p></section>';

      fields.process.innerHTML = hasText(html) ? html : '<p class="muted">'+escapeHTML(t('noProcess'))+'</p>';
    }
    function openDrawer(card){
      renderProcess(getLineage(card.getAttribute('data-lineage-id') || card.id));
      fields.title.textContent = t('sourceDetails');
      overlay.hidden = false;
      document.body.classList.add('source-open');
      requestAnimationFrame(function(){ overlay.classList.add('open'); drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false'); });
    }
    function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); document.body.classList.remove('source-open'); setTimeout(function(){ overlay.hidden = true; },220); }

    document.querySelectorAll('.source-enabled .source-btn').forEach(function(btn){
      btn.addEventListener('click',function(event){
        event.preventDefault();
        event.stopPropagation();
        var card = btn.closest('.source-enabled');
        if(card) openDrawer(card);
      });
    });

    function passThrough(target, card){
      for(var node = target; node && node !== card; node = node.parentNode){
        if(node.nodeType !== 1) continue;
        var tag = String(node.tagName || '').toLowerCase();
        if(tag === 'a' || tag === 'button' || tag === 'input' || tag === 'select' || tag === 'textarea' || tag === 'label') return true;
      }
      return false;
    }
    function selecting(){
      try { var sel = window.getSelection(); return !!sel && String(sel).length > 0; } catch(error){ return false; }
    }
    document.querySelectorAll('[data-source-card]').forEach(function(card){
      card.addEventListener('click',function(event){
        if(passThrough(event.target, card) || selecting()) return;
        openDrawer(card);
      });
      card.addEventListener('keydown',function(event){
        if(event.key !== 'Enter' && event.key !== ' ') return;
        if(event.target !== card) return;
        event.preventDefault();
        openDrawer(card);
      });
    });
    document.querySelectorAll('[data-source-close]').forEach(function(el){ el.addEventListener('click', closeDrawer); });
    document.addEventListener('keydown',function(event){ if(event.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });
  }
  var safeStorage=function(){var s;try{s=typeof localStorage!=='undefined'?localStorage:null;}catch(e){s=null;}return{get:function(k){try{return s?s.getItem(k):null;}catch(e){return null;}},set:function(k,v){try{if(s)s.setItem(k,v);}catch(e){}}};}();
  var tocScrollbarFrame = 0;
  function updateTocScrollbarHeight(){
    if(tocScrollbarFrame) cancelAnimationFrame(tocScrollbarFrame);
    tocScrollbarFrame = requestAnimationFrame(function(){
      tocScrollbarFrame = 0;
      var el = document.querySelector('.sidebar-nav .nav-links');
      if(!el) return;
      var visible = el.getClientRects && el.getClientRects().length > 0;
      var hasScroll = visible && el.scrollWidth > el.clientWidth + 1;
      var height = hasScroll ? Math.max(0, el.offsetHeight - el.clientHeight) : 0;
      var value = height + 'px';
      if(el.style.getPropertyValue('--toc-scrollbar-height') !== value) el.style.setProperty('--toc-scrollbar-height', value);
      var nav = document.getElementById('reportNav');
      var navStyle = nav ? getComputedStyle(nav) : null;
      var overlapsContent = navStyle && (navStyle.position === 'sticky' || navStyle.position === 'fixed') && window.innerWidth < 1680;
      var offset = overlapsContent ? Math.ceil(nav.getBoundingClientRect().height + 12) : 24;
      document.documentElement.style.setProperty('--toc-offset',offset+'px');
    });
  }
  var layoutFrame = 0;
  function scheduleResponsiveLayout(force){
    if(layoutFrame) cancelAnimationFrame(layoutFrame);
    layoutFrame = requestAnimationFrame(function(){
      layoutFrame = 0;
      placeNavForViewport();
      resizeCharts(force === true);
      updateTocScrollbarHeight();
      window.dispatchEvent(new CustomEvent('reportlayoutchange'));
    });
  }
  function bindSidebar(){
    var key = 'abi_report_sidebar_collapsed';
    var btn = document.querySelector('.nav-toggle');
    if(!btn) return;
    function apply(collapsed){ document.body.classList.toggle('sidebar-collapsed', collapsed); btn.setAttribute('aria-label', collapsed ? t('expand') : t('collapse')); btn.setAttribute('aria-expanded', String(!collapsed)); updateTocScrollbarHeight(); }
    apply(safeStorage.get(key) === '1');
    btn.addEventListener('click',function(){ var collapsed = !document.body.classList.contains('sidebar-collapsed'); apply(collapsed); safeStorage.set(key, collapsed ? '1' : '0'); setTimeout(function(){ window.dispatchEvent(new Event('resize')); updateTocScrollbarHeight(); },240); });
    window.addEventListener('resize',function(){ scheduleResponsiveLayout(false); });
    if(window.ResizeObserver){
      var observer = new ResizeObserver(function(){ scheduleResponsiveLayout(false); });
      var app = document.getElementById('app');
      if(app) observer.observe(app);
    }
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateTocScrollbarHeight).catch(function(){});
  }
  function bindActiveNav(){
    var links = Array.from(document.querySelectorAll('.sidebar-nav a[href^="#"]'));
    if(!links.length) return;
    var byId = new Map(links.map(function(a){ return [a.getAttribute('href').slice(1), a]; }));
    var activeLink = null;
    var scrollFrame = 0;
    function isVisibleLink(link){ return !!(link && link.getClientRects && link.getClientRects().length); }
    function linkForHash(hash){
      var id = String(hash || '').replace(/^#/,'');
      var link = byId.get(id);
      if(isVisibleLink(link)) return link;
      var target = id ? document.getElementById(id) : null;
      var section = target && target.closest ? target.closest('.card[id]') : null;
      return section ? byId.get(section.id) || link : link;
    }
    function setActive(link){
      if(!link || link === activeLink) return;
      links.forEach(function(a){ a.classList.remove('active'); });
      link.classList.add('active');
      activeLink = link;
      var list = link.closest('.nav-links');
      if(list && list.scrollWidth > list.clientWidth){
        var left = link.offsetLeft - Math.max(0,(list.clientWidth - link.offsetWidth) / 2);
        list.scrollTo({left:Math.max(0,left),behavior:'smooth'});
      }
    }

    var ACTIVATION_EPSILON = 1;
    function getActivationLine(){
      var raw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--toc-offset'));
      return (isFinite(raw) && raw > 0 ? raw : 24) + ACTIVATION_EPSILON;
    }

    var CLICK_LOCK_MS = 1000;
    var clickLockAt = 0;
    function lockActiveFromClick(){ clickLockAt = Date.now(); }
    function releaseActiveLock(){ clickLockAt = 0; }
    function activeLocked(){ return clickLockAt > 0 && Date.now() - clickLockAt < CLICK_LOCK_MS; }
    function atDocumentBottom(){
      var doc = document.documentElement;
      var max = Math.max(doc.scrollHeight, document.body ? document.body.scrollHeight : 0);
      return window.innerHeight + window.scrollY >= max - 2;
    }
    function syncFromScroll(){
      if(activeLocked()) return;
      var visibleLinks = links.filter(isVisibleLink);

      if(atDocumentBottom()){
        setActive(visibleLinks[visibleLinks.length - 1] || links[links.length - 1]);
        return;
      }
      var marker = getActivationLine();
      var active = null;
      visibleLinks.forEach(function(link){
        var id = link.getAttribute('href').slice(1);
        var target = document.getElementById(id);
        if(target && target.getBoundingClientRect().top <= marker) active = link;
      });
      setActive(active || visibleLinks[0] || links[0]);
    }
    function scheduleScrollSync(){
      if(scrollFrame) return;
      scrollFrame = requestAnimationFrame(function(){
        scrollFrame = 0;
        syncFromScroll();
      });
    }
    function syncFromHash(){
      setActive(linkForHash(location.hash) || links[0]);
    }
    links.forEach(function(link){
      link.addEventListener('click',function(){
        lockActiveFromClick();
        setActive(link);
      });
    });

    ['wheel','touchmove','keydown'].forEach(function(type){
      window.addEventListener(type,releaseActiveLock,{passive:true});
    });
    window.addEventListener('hashchange',syncFromHash);
    window.addEventListener('scroll',scheduleScrollSync,{passive:true});
    window.addEventListener('reportlayoutchange',scheduleScrollSync);
    syncFromHash();
    scheduleScrollSync();
  }
  function bindBackTop(){
    var button = document.getElementById('backTop');
    if(!button) return;
    function sync(){ button.classList.toggle('show',window.scrollY > Math.max(360,window.innerHeight * .65)); }
    button.addEventListener('click',function(){ window.scrollTo({top:0,behavior:'smooth'}); });
    window.addEventListener('scroll',sync,{passive:true});
    sync();
  }
  function bindAnchorScroll(){
    document.addEventListener('click', function(e){
      var a = e.target.closest('a');
      if(!a) return;
      if(e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
      var href = a.getAttribute('href');
      if(!href) return;
      if(href === '#'){
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      var hash = a.hash;
      if(!hash || hash === '#') return;
      var targetId;
      try { targetId = decodeURIComponent(hash.slice(1)); }
      catch(err){ targetId = hash.slice(1); }
      var targetElem = document.getElementById(targetId);
      e.preventDefault();
      if(targetElem){
        if(history && history.pushState) history.pushState(null, '', '#' + targetId);
        else location.hash = targetId;
        window.dispatchEvent(new Event('hashchange'));
        targetElem.scrollIntoView({ behavior: 'smooth' });
      } else {
        console.warn('Anchor target not found: #' + targetId);
      }
    });
  }
  ready(function(){ renderReport(readReport()); bindSidebar(); bindAnchorScroll(); bindBackTop(); scheduleResponsiveLayout(true); });
})();
</script>
